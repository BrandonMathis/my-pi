name: Bug report
description: Report a problem with pi-working-phrase
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: "pi --version"
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node --version"
  - type: textarea
    id: config
    attributes:
      label: Relevant config or phrases
      render: ts
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install extension at ...
        2. Run /reload
        3. Send prompt ...
