name: Feature request
description: Suggest a focused working-status improvement
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What working-status customization problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve it.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Does this fit the project scope?
      description: This project only customizes Pi's working status.
      options:
        - Yes, it only affects working phrases, spinner, color, shine, or timing.
        - Unsure.
        - No, it would add commands, widgets, settings UI, persistence, or unrelated UI.
    validations:
      required: true
